[alembic]
script_location = migrations
prepend_sys_path = .

# sqlalchemy.url is intentionally left unset here — migrations/env.py reads
# DATABASE_URL from the environment/.env at runtime (via app.core.config),
# so the same migration works against whatever environment you point it at
# without editing this file. See docs/decisions.md §10 (no hard-coded
# hosting/provider details).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

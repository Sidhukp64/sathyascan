# Render Blueprint for 1-Click Public Deployment of SathyaScan
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: sathyascan
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore # or oregon, frankfurt, etc.
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sathyascan-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sathyascan-redis
          property: connectionString
      - key: PHONE_HASH_PEPPER
        generateValue: true
      - key: PHONE_ENCRYPTION_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SEARCH_API_KEY
        sync: false

  - type: redis
    name: sathyascan-redis
    plan: starter
    ipAllowList: []

databases:
  - name: sathyascan-db
    databaseName: sathyascan
    user: sathyascan
    plan: starter
